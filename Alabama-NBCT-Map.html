// Schools that share an exact coordinate (most often unresolved addresses reverted to
// the LEA/district office, or several schools whose address genuinely couldn't be matched)
// would otherwise stack as concentric circles, hiding all but the largest one. Spread each
// group into a small phyllotactic spiral around the shared point so every school gets its
// own visible marker.
(function spreadOverlappingPoints() {
  const groups = {};
  points.forEach(function(p) {
    if (p.lat === null || p.lon === null) return;
    const key = p.lat.toFixed(5) + ',' + p.lon.toFixed(5);
    (groups[key] = groups[key] || []).push(p);
  });
  const GOLDEN_ANGLE = 2.399963; // radians (~137.5°), gives even non-overlapping spacing
  const SPREAD_UNIT = 0.00035;   // degrees; base spacing between adjacent spiraled points
  Object.keys(groups).forEach(function(key) {
    const group = groups[key];
    if (group.length < 2) return;
    const latRad = group[0].lat * Math.PI / 180;
    group.forEach(function(p, i) {
      const r = SPREAD_UNIT * Math.sqrt(i + 1);
      const angle = i * GOLDEN_ANGLE;
      p._mapLat = p.lat + r * Math.cos(angle);
      p._mapLon = p.lon + (r * Math.sin(angle)) / Math.cos(latRad);
    });
  });
})();

// One Leaflet layer group per RIC region (plus "Unassigned" for non-LEA employers:
// private schools, universities, state-run programs) so the sidebar filter can toggle
// regions on and off independently.
const regionLayers = {};
const regionCounts = {};

points.forEach(function(p) {
  if (p.lat === null || p.lon === null) return;
  const region = p.region || 'Unassigned';
  if (!regionLayers[region]) {
    regionLayers[region] = L.layerGroup();
    regionCounts[region] = 0;
  }
  regionCounts[region]++;

  const color = regionColors[region] || '#999999';
  const plotLat = p._mapLat !== undefined ? p._mapLat : p.lat;
  const plotLon = p._mapLon !== undefined ? p._mapLon : p.lon;
  const marker = L.circleMarker([plotLat, plotLon], {
    radius: radiusFor(p.total),
    fillColor: color,
    color: '#333',
    weight: 1,
    opacity: 0.85,
    fillOpacity: 0.7
  });

  let approxNote = '';
  if (p.districtLevel) {
    approxNote = '<div class="popup-note">No specific school on file for these NBCTs — pinned to district location.</div>';
  } else if (p.approx) {
    approxNote = '<div class="popup-note">Approximate — pinned to district location; exact school address not matched.</div>';
  }
  let charterNote = p.charter ? '<div class="popup-note" style="color:var(--red);font-style:normal;">Charter school</div>' : '';

  marker.bindPopup(
    '<div class="popup-title">' + p.school + '</div>' +
    '<div class="popup-district">' + p.district + '</div>' +
    '<div class="popup-region">' + region + '</div>' +
    '<div class="popup-row">Active: ' + p.active + ' &nbsp;|&nbsp; Lapsed: ' + p.lapsed + (p.other ? (' &nbsp;|&nbsp; Other: ' + p.other) : '') + '</div>' +
    '<div class="popup-row">Total: ' + p.total + '</div>' +
    charterNote + approxNote
  );
  regionLayers[region].addTo(map).addLayer(marker);
});

// Sort regions numerically (Region 1..11), then any non-numbered ("Unassigned") last.
const regionOrder = Object.keys(regionLayers).sort(function(a, b) {
  const na = parseInt((a.match(/\d+/) || [Infinity])[0], 10);
  const nb = parseInt((b.match(/\d+/) || [Infinity])[0], 10);
  return na - nb;
});

const filterControl = L.control({position: 'bottomright'});
filterControl.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);

  let html = '<div class="legend-title">RIC Region — click to filter</div>';
  html += '<div class="legend-actions"><button type="button" id="region-all">All</button><button type="button" id="region-none">None</button></div>';
  regionOrder.forEach(function(region) {
    const color = regionColors[region] || '#999999';
    const label = region === 'Unassigned'
      ? 'Unassigned'
      : region + ' — ' + (regionFullNames[region] || '');
    const count = regionCounts[region] || 0;
    html += '<label><input type="checkbox" class="region-toggle" data-region="' + region + '" checked>' +
      '<span class="dot" style="background:' + color + '"></span>' + label +
      '<span class="rcount">(' + count + ')</span></label>';
  });
  div.innerHTML = html;
  return div;
};
filterControl.addTo(map);

document.addEventListener('change', function(e) {
  if (!e.target.classList || !e.target.classList.contains('region-toggle')) return;
  const region = e.target.getAttribute('data-region');
  const layer = regionLayers[region];
  if (!layer) return;
  if (e.target.checked) {
    map.addLayer(layer);
  } else {
    map.removeLayer(layer);
  }
});

document.addEventListener('click', function(e) {
  if (e.target && e.target.id === 'region-all') {
    document.querySelectorAll('.region-toggle').forEach(function(cb) {
      cb.checked = true;
      const layer = regionLayers[cb.getAttribute('data-region')];
      if (layer) map.addLayer(layer);
    });
  }
  if (e.target && e.target.id === 'region-none') {
    document.querySelectorAll('.region-toggle').forEach(function(cb) {
      cb.checked = false;
      const layer = regionLayers[cb.getAttribute('data-region')];
      if (layer) map.removeLayer(layer);
    });
  }
});
</script>
