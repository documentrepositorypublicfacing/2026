  let charterNote = p.charter ? '<div class="popup-note" style="color:var(--red);font-style:normal;">Charter school</div>' : '';

  marker.bindPopup(
    '<div class="popup-title">' + p.school + '</div>' +
    '<div class="popup-district">' + p.district + '</div>' +
    '<div class="popup-region">' + p.region + '</div>' +
    '<div class="popup-row">Active: ' + p.active + ' &nbsp;|&nbsp; Lapsed: ' + p.lapsed + (p.other ? (' &nbsp;|&nbsp; Other: ' + p.other) : '') + '</div>' +
    '<div class="popup-row">Total: ' + p.total + '</div>' +
    charterNote + approxNote
  );
  marker.addTo(map);
});

const legend = L.control({position: 'bottomright'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  let html = '<div class="legend-title">RIC Region</div>';
  html += `<div><span class="dot" style="background:#e6194b"></span>Region 1 — University of North Alabama</div><div><span class="dot" style="background:#3cb44b"></span>Region 2 — Athens State University</div><div><span class="dot" style="background:#4363d8"></span>Region 3 — Alabama A&M University</div><div><span class="dot" style="background:#f58231"></span>Region 4 — University of Alabama (UA-UWA)</div><div><span class="dot" style="background:#911eb4"></span>Region 5 — University of Alabama at Birmingham</div><div><span class="dot" style="background:#42d4f4"></span>Region 6 — Jacksonville State University</div><div><span class="dot" style="background:#f032e6"></span>Region 7 — University of Montevallo</div><div><span class="dot" style="background:#bfa500"></span>Region 8 — Alabama State University</div><div><span class="dot" style="background:#000075"></span>Region 9 — Auburn University</div><div><span class="dot" style="background:#808000"></span>Region 10 — University of South Alabama</div><div><span class="dot" style="background:#800000"></span>Region 11 — Troy University</div>`;
  div.innerHTML = html;
  return div;
};
legend.addTo(map);
</script>
