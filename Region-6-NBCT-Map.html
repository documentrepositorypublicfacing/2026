const map = L.map('map', { scrollWheelZoom: true }).setView([33.85, -85.95], 9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function radiusFor(count) {
  return 6 + Math.sqrt(count) * 6;
}

function colorFor(count) {
  if (count >= 10) return '#7a0177';
  if (count >= 5) return '#c51b8a';
  if (count >= 3) return '#f768a1';
  if (count >= 1) return '#fbb4b9';
  return '#cccccc';
}

const markers = [];

points.forEach(function(p) {
  if (p.lat === null || p.lon === null) return;
  const count = p.active;
  const marker = L.circleMarker([p.lat, p.lon], {
    radius: radiusFor(Math.max(count, p.total, 1)),
    fillColor: colorFor(count),
    color: '#5a0a41',
    weight: 1,
    opacity: 0.8,
    fillOpacity: 0.7
  });

  let confidenceNote = '';
  if (p.geocode_method === 'district_fallback') {
    confidenceNote = '<div class="popup-note">Approximate — pinned to district location; exact school address not found.</div>';
  } else if (p.geocode_method === 'manual_town_fallback') {
    confidenceNote = '<div class="popup-note">Approximate — pinned to town center; exact school address not found.</div>';
  }

  marker.bindPopup(
    '<div class="popup-title">' + p.school_disp + '</div>' +
    '<div class="popup-district">' + p.district_disp + '</div>' +
    '<div class="popup-row"><b>Active NBCTs:</b> ' + p.active + '</div>' +
    (p.lapsed ? '<div class="popup-row"><b>Lapsed:</b> ' + p.lapsed + '</div>' : '') +
    (p.other ? '<div class="popup-row"><b>Unspecified status:</b> ' + p.other + '</div>' : '') +
    confidenceNote
  );

  marker.addTo(map);
  markers.push(marker);
});

// legend
const legend = L.control({position: 'bottomright'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML =
    '<div style="font-weight:600; margin-bottom:6px;">Active NBCTs at school</div>' +
    '<div><span class="dot" style="width:10px;height:10px;background:#fbb4b9;"></span> 1–2</div>' +
    '<div><span class="dot" style="width:14px;height:14px;background:#f768a1;"></span> 3–4</div>' +
    '<div><span class="dot" style="width:18px;height:18px;background:#c51b8a;"></span> 5–9</div>' +
    '<div><span class="dot" style="width:24px;height:24px;background:#7a0177;"></span> 10+</div>' +
    '<div style="margin-top:6px; color:#888; font-size:0.72rem;">Circle size scales with count. Click a school for details.</div>';
  return div;
};
legend.addTo(map);

const group = new L.featureGroup(markers);
map.fitBounds(group.getBounds().pad(0.1));
</script>
